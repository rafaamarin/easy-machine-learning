[project]
name = "libro-ml-dl"
version = "0.1.0"
description = "Libro local e interactivo de Machine Learning y Deep Learning"
requires-python = ">=3.11"
dependencies = [
    "Markdown==3.10.3",
]

[dependency-groups]
validation = [
    "matplotlib==3.10.8",
    "numpy==2.4.6",
    "pandas==3.0.5",
    "ruff==0.16.4",
    "scikit-learn==1.8.0",
]
notebooks = [
    "ipykernel>=6.30,<8",
    "jupyterlab>=4.4,<5",
    "matplotlib==3.10.8",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "numpy==2.4.6",
    "pandas==3.0.5",
    "scikit-learn==1.8.0",
]
security = [
    "detect-secrets==1.5.0",
    "pip-audit==2.10.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
